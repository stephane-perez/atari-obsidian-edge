name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  EMUTOS_URL: https://sourceforge.net/projects/emutos/files/emutos/1.3/emutos-512k-1.3.zip/download
  EMUTOS_SHA256: 65fcee085560745aaa8d9938bd35f7b2fe6277b035cc8146c349dcad4a5bc4c5
  # the official Diamond Edge 2.57 binaries, only used as a size reference
  DE257_URL: https://sourceforge.net/projects/diamond-edge/files/releases/v2.57/v257_binaries.zip/download
  DE257_SHA256: 0703fd896ce75c7b4162b440b3ff53066e003a4de8be8eda4513f8cd577441f4

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check the encoding of the sources
        run: |
          # the inherited sources are 8-bit (Atari character set): an editor
          # converting them to UTF-8 replaces those bytes with U+FFFD
          if grep -rlI --exclude-dir=.git --exclude-dir=build --exclude-dir=.tools $'\xef\xbf\xbd' . ; then
            echo "::error::U+FFFD (replacement character) found: a file was converted to UTF-8"
            exit 1
          fi

      - name: Install the m68k-atari-mint cross toolchain
        run: |
          sudo add-apt-repository -y ppa:vriviere/ppa
          sudo apt-get update
          sudo apt-get install -y cross-mint-essential
          m68k-atari-mint-gcc --version | head -1

      - name: Cache libcmini
        uses: actions/cache@v4
        with:
          path: .tools/libcmini
          key: libcmini-${{ hashFiles('scripts/get-libcmini.sh') }}

      - name: Build libcmini (pinned commit)
        run: sh scripts/get-libcmini.sh

      - name: Build (libcmini)
        run: make -j"$(nproc)" all zip

      - name: Build with MiNTLib, for comparison
        run: make -j"$(nproc)" LIBC=mintlib BUILD=build/mintlib all

      - name: Compare the sizes
        run: |
          mkdir -p build/de257
          for i in 1 2 3; do
            curl -sSfL -o de257.zip "$DE257_URL" && break
            sleep 10
          done
          echo "$DE257_SHA256  de257.zip" | sha256sum -c -
          unzip -q -o de257.zip '*.PRG' -d build/de257
          {
            echo "### Program sizes (bytes)"
            echo
            echo "*memory* = TEXT + DATA + BSS, what the program needs once loaded."
            echo
            python3 tools/prg_sizes.py libcmini=build mintlib=build/mintlib "Diamond Edge 2.57=build/de257"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the Atari files
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-edge-${{ github.sha }}
          path: build/dist/
          if-no-files-found: error

      - name: Install Hatari and get EmuTOS
        run: |
          sudo apt-get install -y hatari xvfb xdotool python3-pil
          for i in 1 2 3; do
            curl -sSfL -o emutos.zip "$EMUTOS_URL" && break
            sleep 10
          done
          echo "$EMUTOS_SHA256  emutos.zip" | sha256sum -c -
          unzip -q emutos.zip -d "$RUNNER_TEMP"

      - name: Smoke test in Hatari (EmuTOS), libcmini build
        run: make smoke-test EMUTOS="$RUNNER_TEMP/emutos-512k-1.3/etos512uk.img"

      - name: Upload the smoke test screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-${{ github.sha }}
          path: |
            build/smoke/
            !build/smoke/drive_c/
          if-no-files-found: ignore
